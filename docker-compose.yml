name: nova-clip

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://nova:${POSTGRES_PASSWORD:-nova_change_me}@postgres:5432/nova_clip
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /media
  MODEL_CACHE_DIR: /models
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  GENERATION_BACKEND: ${GENERATION_BACKEND:-wan}
  VIDEO_MODEL_ID: ${VIDEO_MODEL_ID:-Wan-AI/Wan2.1-T2V-14B-Diffusers}
  VIDEO_TRANSFORMER_URI: ${VIDEO_TRANSFORMER_URI:-https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/blob/main/split_files/diffusion_models/wan2.1_t2v_14B_fp8_e4m3fn.safetensors}
  WAN_VACE_TRANSFORMER_URI: ${WAN_VACE_TRANSFORMER_URI:-https://huggingface.co/Kamikaze-88/Wan2.1-VACE-14B-fp8/blob/main/wan2.1_vace_14B_fp8_e4m3fn.safetensors}
  WAN_CONTINUITY_FRAMES: ${WAN_CONTINUITY_FRAMES:-5}
  WAN_VACE_FAST_STEPS: ${WAN_VACE_FAST_STEPS:-12}
  WAN_VACE_BALANCED_STEPS: ${WAN_VACE_BALANCED_STEPS:-18}
  WAN_VACE_QUALITY_STEPS: ${WAN_VACE_QUALITY_STEPS:-30}

  WAN_FP8: ${WAN_FP8:-true}
  WAN_OFFLOAD_MODE: ${WAN_OFFLOAD_MODE:-model}
  MODEL_CPU_OFFLOAD: ${MODEL_CPU_OFFLOAD:-true}
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
  GPU_LOCK_TIMEOUT_SECONDS: ${GPU_LOCK_TIMEOUT_SECONDS:-21600}
  FFMPEG_HARDWARE_ENCODER: ${FFMPEG_HARDWARE_ENCODER:-auto}
  CORS_ORIGINS: ${CORS_ORIGINS:-["https://localhost"]}

x-backend-volumes: &backend-volumes
  - media:/media
  - model-cache:/models

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova_clip
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_clip"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: curlimages/curl:8.11.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    command: ["sh", "-c", "curl -fsS http://ollama:11434/api/pull -d '{\"name\":\"'\"$${OLLAMA_MODEL}\"'\",\"stream\":false}'"]
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  gpu-worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=gpu", "--concurrency=1", "--max-tasks-per-child=1", "--hostname=gpu@%h"]
    environment: *backend-env
    volumes: *backend-volumes
    shm_size: "8gb"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stop_grace_period: 2m

  media-worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=media", "--concurrency=1", "--hostname=media@%h"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  media:
  model-cache:
  ollama-data:
  caddy-data:
  caddy-config:

